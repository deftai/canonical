version: '3'

# Multi-agent verbs (Stream G): swarm:run, review-monitor.
# EVERY task: dir USER_WORKING_DIR, deps on engine:_ts-build, ENGINE_VERB + CLI_ARGS_LIST argv-array transport;
# --project-root appended by engine-invoke. NO sources:/generates:.
# NOTE: no leading colon on engine:* refs -- with `flatten: true` on this
# include, a leading-colon (root-absolute) reference does not resolve to the
# internal `engine` namespace and go-task reports "Task does not exist".
# Bare `engine:_ts-build` / `engine:invoke` resolves correctly (verified).

tasks:
  "swarm:run":
    desc: "Cohort prep or finalize for multi-agent story batches; never spawns."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'swarm:run'

  "review-monitor":
    desc: "Sticky PR review-ownership lease: register, release, or check."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'review-monitor'
