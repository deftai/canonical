version: '3'

# Solo-path verbs (Stream G). EVERY task: dir USER_WORKING_DIR, deps on
# engine:_ts-build, ENGINE_VERB + CLI_ARGS_LIST argv-array transport;
# --project-root appended by engine-invoke. NO sources:/generates:.
# NOTE: no leading colon on engine:* refs -- with `flatten: true` on this
# include, a leading-colon (root-absolute) reference does not resolve to the
# internal `engine` namespace and go-task reports "Task does not exist".
# Bare `engine:_ts-build` / `engine:invoke` resolves correctly (verified).

tasks:
  "setup":
    desc: "One-time per clone: wire git hooks and probe toolchain presence."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'setup'

  "orient":
    desc: "Mutation-session readiness snapshot: git status, xbrief/, core tools."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'orient'

  "check":
    desc: "Project quality gate: format, lint, build, test, state:validate, verify:encoding."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'check'

  "state:validate":
    desc: "Validate all xbrief/**/*.json for schema shape and lifecycle consistency."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'state:validate'

  "verify:branch":
    desc: "Exit 1 if HEAD is the default branch, unless overridden by policy or env."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'verify:branch'

  "verify:encoding":
    desc: "Scan tracked text files for BOM, U+FFFD, mojibake, and non-ASCII punctuation."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'verify:encoding'

  "verify:forward-coverage":
    desc: "Require a staged test file for each staged new source file."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'verify:forward-coverage'

  "work:next":
    desc: "Print the next work item from xbrief/plan.json or xbrief/pending/."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'work:next'

  "triage":
    desc: "Record a decision (accept/reject/defer/duplicate) on a candidate."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'triage'

  "scope:new":
    desc: "Create a proposed scope brief."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'scope:new'

  "scope:start":
    desc: "Make a scope implementable in one transaction: promote and activate."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'scope:start'

  "scope:complete":
    desc: "Terminal success: mark a scope completed with delivery evidence."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'scope:complete'

  "scope:stop":
    desc: "Non-happy terminal or pause: cancel, fail, block/unblock, or demote a scope."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'scope:stop'

  "render":
    desc: "Generate ROADMAP.md or SPEC.md from lifecycle folders / xbrief/spec.json."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'render'

  "policy":
    desc: "Show or set policy.* fields."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'policy'

  "collection:status":
    desc: "Show local collection consent state (optional --live)."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'collection:status'

  "collection:identity":
    desc: "Show, clear, or update reply-channel identity (PRIV-2: not in event payloads)."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'collection:identity'

  "collection:opt-in":
    desc: "Opt in to anonymous feedback/bug/feature/usage collection."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'collection:opt-in'

  "collection:decline":
    desc: "Decline collection locally without registering."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'collection:decline'

  "collection:opt-out":
    desc: "Revoke collection consent and clear credentials."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'collection:opt-out'

  "collection:metric":
    desc: "Emit a usage metric when opted in (soft-fail)."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'collection:metric'

  "feedback":
    desc: "Submit bug, feature request, or general feedback."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_VERB: 'feedback'
