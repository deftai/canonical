version: '3'

# Ship-path verbs (Stream G): pr:watch, pr:finish, issue:sync.
# EVERY task: dir USER_WORKING_DIR, deps on engine:_ts-build, ENGINE_CMD with
# {{.CLI_ARGS}} forwarded bare and --project-root appended. NO sources:/generates:.
# NOTE: no leading colon on engine:* refs -- with `flatten: true` on this
# include, a leading-colon (root-absolute) reference does not resolve to the
# internal `engine` namespace and go-task reports "Task does not exist".
# Bare `engine:_ts-build` / `engine:invoke` resolves correctly (verified).

tasks:
  "pr:watch":
    desc: "Poll one PR until terminal state for the current head SHA."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_CMD: 'pr:watch {{.CLI_ARGS}} --project-root "{{.USER_WORKING_DIR}}"'

  "pr:finish":
    desc: "Fail-closed merge: verify CLEAN, squash-merge, and close the linked issue."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_CMD: 'pr:finish {{.CLI_ARGS}} --project-root "{{.USER_WORKING_DIR}}"'

  "issue:sync":
    desc: "Deterministic origin <-> scope sync: ingest, emit, or reconcile."
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: engine:_ts-build
    cmds:
      - task: engine:invoke
        vars:
          ENGINE_CMD: 'issue:sync {{.CLI_ARGS}} --project-root "{{.USER_WORKING_DIR}}"'
