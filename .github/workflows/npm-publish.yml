name: npm publish

# Publishes @deftai/canonical on release tags. Adapted from deftai/directive's
# proven workflow, radically simplified by the single-package model: no version
# alignment loop, no workspace-protocol rewrite -- one `npm publish`.

on:
  push:
    tags:
      - "v*"
  # Manual re-publish of an existing tag without tag surgery: dispatch with the
  # tag to (re)publish when a tag-triggered run failed, e.g. v0.1.0.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v0.1.0"
        required: true
        type: string

permissions:
  # id-token: write powers npm TRUSTED PUBLISHING (docs.npmjs.com/trusted-publishers):
  # the npm CLI exchanges the GitHub OIDC token for publish auth -- no NPM_TOKEN
  # secret anywhere. Provenance attestation is automatic under trusted publishing.
  # One-time setup: publish the very first version manually, then on npmjs.com ->
  # package Settings -> Trusted Publisher: GitHub Actions, org "deftai", repo
  # "canonical", workflow filename "npm-publish.yml", no environment.
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish @deftai/canonical to npm
    # GitHub-hosted runner is REQUIRED for npm --provenance: the registry
    # rejects provenance bundles signed on self-hosted runners.
    runs-on: ubuntu-latest
    env:
      REF_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:fast

      - name: Align package version with release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          echo "Publishing @deftai/canonical@${VERSION}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

      # Auth: trusted publishing (OIDC) -- no token env. Requires npm >= 11.5.1
      # (bundled with the Node from .nvmrc) and a GitHub-hosted runner.
      # Idempotent re-publish: a workflow_dispatch rerun must not fail on E409
      # when the version already published.
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          npm publish --access public || {
            npm view "${PKG}@${VER}" version >/dev/null
            echo "Already published ${PKG}@${VER}, continuing"
          }
